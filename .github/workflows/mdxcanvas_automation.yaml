name: Update Canvas Material and Notify Discord

on:
  workflow_call:
    inputs:
      course_id:
        description: >-
          Deprecated, and ignored unless course_info_path cannot be read:
          CANVAS_COURSE_ID in that file is authoritative. Safe to drop.
        required: false
        default: ""
        type: string
      course_name:
        description: >-
          Course name for the Discord message. E.g. "CS 312"
        required: true
        type: string
      course_url:
        description: >-
          Deprecated, and ignored unless course_info_path cannot be read:
          derived from CANVAS_API_URL and CANVAS_COURSE_ID. Safe to drop.
        required: false
        default: ""
        type: string
      utils_ref:
        required: false
        default: main
        type: string
      mdxcanvas_version:
        required: true
        type: string
      course_info_path:
        required: true
        type: string
      global_args_path:
        required: true
        type: string
      template_path:
        required: true
        type: string
      canvas_css_path:
        required: false
        type: string
      extra-packages:
        description: >-
          Extra pip packages for the notification step, space separated. The
          pip line already interpolated this before it was declared, so it
          expanded to empty and read as configurable without being so.
        required: false
        default: ""
        type: string
    secrets:
      discord_role:
        required: true
      canvas_api_token:
        required: true
      discord_webhook_url:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update_canvas_material:
    runs-on: ubuntu-latest
    environment: production

    env:
      LOGS_DIR: ${{ github.workspace }}/.github/logs
      OUTPUT_PATH: ${{ github.workspace }}/.github/logs/mdxcanvas_output.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout utils repo
        uses: actions/checkout@v4
        with:
          repository: BYU-CS-Course-Ops/utils
          ref: ${{ inputs.utils_ref }}
          path: utils

      - name: Install MDXCanvas
        run: pip install mdxcanvas==${{ inputs.mdxcanvas_version }}

      - name: Install notification dependencies
        shell: bash
        run: pip install -r utils/requirements-notifications.txt ${{ inputs.extra-packages }}

      - name: Create logs directory
        run: mkdir -p "$LOGS_DIR"

      - name: Run MDXCanvas
        id: mdxcanvas
        continue-on-error: true
        env:
          CANVAS_API_TOKEN: ${{ secrets.canvas_api_token }}
        run: |
          CMD="mdxcanvas --course-info ${{ github.workspace }}/${{ inputs.course_info_path }} \
                         --global-args ${{ github.workspace }}/${{ inputs.global_args_path }} \
                         --output-file $OUTPUT_PATH"

          if [ -n "${{ inputs.canvas_css_path }}" ]; then
            CMD="$CMD --css ${{ github.workspace }}/${{ inputs.canvas_css_path }}"
          fi

          CMD="$CMD ${{ github.workspace }}/${{ inputs.template_path }}"

          eval "$CMD" \
            > "$LOGS_DIR/mdxcanvas.stdout.log" \
            2> "$LOGS_DIR/mdxcanvas.stderr.log"

      - name: Print debug logs
        run: |
          echo "=== MDXCanvas STDOUT ==="
            cat "$LOGS_DIR/mdxcanvas.stdout.log"

          echo "=== MDXCanvas STDERR ==="
            cat "$LOGS_DIR/mdxcanvas.stderr.log"

      # The course id and URL are already in the file the deploy reads, so they
      # are derived from it rather than taken on trust from the caller. They
      # label the Discord message, and nothing enforced that a hand-written
      # pair matched the course actually deployed to.
      - name: Resolve course id and URL
        id: course
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          INFO="${{ github.workspace }}/${{ inputs.course_info_path }}"
          if DERIVED=$(python3 utils/notifications/course_facts.py "$INFO"); then
            echo "$DERIVED" >> "$GITHUB_OUTPUT"
            GOT_ID=$(printf '%s\n' "$DERIVED" | sed -n 's/^course_id=//p')
            GOT_URL=$(printf '%s\n' "$DERIVED" | sed -n 's/^course_url=//p')
            for pair in "course_id|${{ inputs.course_id }}|$GOT_ID" \
                        "course_url|${{ inputs.course_url }}|$GOT_URL"; do
              IFS='|' read -r name given derived <<< "$pair"
              if [ -n "$given" ] && [ "$given" != "$derived" ]; then
                echo "::warning::$name is $given in this workflow but $derived in" \
                     "${{ inputs.course_info_path }}. The file wins; drop the input."
              fi
            done
          else
            # Never let a label stop a deploy being reported: fall back to what
            # the caller passed, and say why.
            echo "::warning::could not read the course id and URL from" \
                 "${{ inputs.course_info_path }}; using the values this workflow was called with"
            echo "course_id=${{ inputs.course_id }}" >> "$GITHUB_OUTPUT"
            echo "course_url=${{ inputs.course_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Send course notification
        if: always()
        uses: ./utils/.github/actions/send-course-notification
        with:
          notification-type: canvas
          output-type: MDXCanvas
          payload-path: ${{ env.OUTPUT_PATH }}
          stdout-log: ${{ env.LOGS_DIR }}/mdxcanvas.stdout.log
          stderr-log: ${{ env.LOGS_DIR }}/mdxcanvas.stderr.log
          course-id: ${{ steps.course.outputs.course_id }}
          course-name: ${{ inputs.course_name }}
          course-url: ${{ steps.course.outputs.course_url }}
          discord-role: ${{ secrets.discord_role }}
          discord-webhook-url: ${{ secrets.discord_webhook_url }}

      # `continue-on-error` above lets the notification run on a failed deploy,
      # but it also makes the job succeed: GitHub records the step's conclusion
      # as success and only `outcome` keeps the failure. So a deploy that threw
      # halfway through left a green check on the commit, and the course was
      # short whatever had not been pushed yet. Re-fail here, after the
      # notification has gone out, so the check matches what actually happened.
      - name: Fail the job if MDXCanvas failed
        if: always() && steps.mdxcanvas.outcome == 'failure'
        run: |
          echo "::error::MDXCanvas exited non-zero. The deploy is incomplete -- \
          see the MDXCanvas STDERR section above for the failure."
          exit 1
