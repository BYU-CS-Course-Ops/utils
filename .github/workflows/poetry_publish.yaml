name: poetry_build_publish

on:
  workflow_call:
    inputs:
      pypi_package:
        required: true
        type: string
    secrets:
      discord_webhook_url:
        required: true
      discord_role:
        required: true

jobs:
  check-toml-version:
    uses: BYU-CS-Course-Ops/utils/.github/workflows/check_toml.yaml@claude/wonderful-lovelace
    with:
      pypi_package: ${{ inputs.pypi_package }}

  poetry-publish:
    needs: check-toml-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      success: ${{ steps.result.outputs.success }}
      version: ${{ needs.check-toml-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Poetry and Version Plugin
        run: pip install "poetry<2" poetry-version-from-file

      - name: Poetry Install
        run: poetry install

      - name: Build PyPI package
        run: poetry build

      - name: Check version was bumped
        id: check
        run: |
          if [ "${{ needs.check-toml-version.outputs.uped_toml }}" != "true" ]; then
            echo "pyproject.toml version was not updated — skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to PyPI via trusted publisher
        id: publish
        if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Set publish result
        id: result
        if: always()
        run: |
          if [ "${{ steps.check.outputs.skip }}" == "true" ]; then
            echo "success=false" >> $GITHUB_OUTPUT
          elif [ "${{ steps.publish.outcome }}" == "success" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

  notify-discord:
    needs: [check-toml-version, poetry-publish]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout utils repo
        uses: actions/checkout@v4
        with:
          repository: BYU-CS-Course-Ops/utils
          path: utils

      - name: Install notification dependencies
        shell: bash
        run: pip install discord-webhook

      - name: Send PyPI notification
        uses: BYU-CS-Course-Ops/utils/.github/actions/send-pypi-notification@claude/wonderful-lovelace
        with:
          pypi-package: ${{ inputs.pypi_package }}
          success: ${{ needs.poetry-publish.outputs.success }}
          toml-updated: ${{ needs.check-toml-version.outputs.uped_toml }}
          version: ${{ needs.poetry-publish.outputs.version }}
          discord-role: ${{ secrets.discord_role }}
          discord-webhook-url: ${{ secrets.discord_webhook_url }}
          old-version: ${{ needs.check-toml-version.outputs.pypi_version }}
