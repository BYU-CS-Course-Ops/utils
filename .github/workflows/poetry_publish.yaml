name: poetry_build_publish

on:
  workflow_call:
    inputs:
      pypi_package:
        required: true
        type: string
    secrets:
      discord_webhook_url:
        required: true
      discord_role:
        required: true

jobs:
  poetry-publish:
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.result.outputs.success }}
      version: ${{ steps.get_build_version.outputs.version }}
      uped_toml: ${{ steps.extract_update.outputs.uped_toml }}
      pypi_version: ${{ steps.get_pypi_version.outputs.pypi_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout utils repo
        uses: actions/checkout@v4
        with:
          repository: BYU-CS-Course-Ops/utils
          ref: claude/wonderful-lovelace
          path: utils

      - name: Get version from PyPI
        id: get_pypi_version
        run: |
          VERSION=$(curl -s https://pypi.org/pypi/${{ inputs.pypi_package }}/json | jq -r '.info.version // empty')
          echo "pypi_version=${VERSION:-}" >> $GITHUB_ENV
          echo "pypi_version=${VERSION:-}" >> $GITHUB_OUTPUT

      - name: Install Poetry and Version Plugin
        run: pip install "poetry<2" poetry-version-from-file

      - name: Poetry Install
        run: poetry install

      - name: Build PyPI package
        run: poetry build

      - name: Get version from poetry build
        id: get_build_version
        run: |
          VERSION=$(poetry version -s)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check for version update
        id: extract_update
        run: |
          if python3 utils/.github/scripts/check_version.py "${{ steps.get_build_version.outputs.version }}" "${{ env.pypi_version }}"; then
            echo "uped_toml=true" >> $GITHUB_OUTPUT
          else
            echo "uped_toml=false" >> $GITHUB_OUTPUT
          fi

      - name: Check version was bumped
        id: check
        run: |
          if [ "${{ steps.extract_update.outputs.uped_toml }}" != "true" ]; then
            echo "pyproject.toml version was not updated — skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to PyPI via trusted publisher
        id: publish
        if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Set publish result
        id: result
        if: always()
        run: |
          if [ "${{ steps.check.outputs.skip }}" == "true" ]; then
            echo "success=false" >> $GITHUB_OUTPUT
          elif [ "${{ steps.publish.outcome }}" == "success" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

  notify-discord:
    needs: poetry-publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout utils repo
        uses: actions/checkout@v4
        with:
          repository: BYU-CS-Course-Ops/utils
          ref: claude/wonderful-lovelace
          path: utils

      - name: Install notification dependencies
        shell: bash
        run: pip install discord-webhook markdowndata

      - name: Send PyPI notification
        uses: BYU-CS-Course-Ops/utils/.github/actions/send-pypi-notification@claude/wonderful-lovelace
        with:
          pypi-package: ${{ inputs.pypi_package }}
          success: ${{ needs.poetry-publish.outputs.success }}
          toml-updated: ${{ needs.poetry-publish.outputs.uped_toml }}
          version: ${{ needs.poetry-publish.outputs.version }}
          discord-role: ${{ secrets.discord_role }}
          discord-webhook-url: ${{ secrets.discord_webhook_url }}
          old-version: ${{ needs.poetry-publish.outputs.pypi_version }}
