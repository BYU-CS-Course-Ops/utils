name: Notify Discord About Release

on:
  workflow_call:
    inputs:
      project_name:
        description: "Name displayed in the Discord notification"
        required: true
        type: string
      version:
        description: "Release version; if omitted, read from the configured version source"
        required: false
        default: ""
        type: string
      version_source:
        description: "Version source: 'toml' or 'file'"
        required: false
        default: "toml"
        type: string
      version_path:
        description: "Path to the plaintext version file when version_source is 'file'"
        required: false
        default: "VERSION"
        type: string
      changelog_path:
        description: "Optional path to the changelog file"
        required: false
        default: ""
        type: string
      success:
        description: "Whether the release succeeded"
        required: false
        default: true
        type: boolean
    secrets:
      discord_webhook_url:
        description: "One destination per line: webhook URL followed by optional space-separated role IDs"
        required: true
      discord_role:
        description: "Fallback role ID for webhook lines without explicit role IDs"
        required: false

permissions:
  contents: read

jobs:
  notify:
    name: Post release notification
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and send Discord notifications
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          INPUT_VERSION: ${{ inputs.version }}
          VERSION_SOURCE: ${{ inputs.version_source }}
          VERSION_PATH: ${{ inputs.version_path }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          RELEASE_SUCCESS: ${{ inputs.success }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          DISCORD_ROLE_ID: ${{ secrets.discord_role }}
          DISCORD_WEBHOOK_URL: ${{ secrets.discord_webhook_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import tomllib
          from urllib.request import Request, urlopen

          root = Path.cwd()
          project_name = os.environ["PROJECT_NAME"]
          version = os.environ["INPUT_VERSION"].strip()

          if not version:
              source = os.environ["VERSION_SOURCE"].strip().lower()
              if source == "toml":
                  pyproject = tomllib.loads((root / "pyproject.toml").read_text())
                  project = pyproject.get("project", {})
                  version = project.get("version") or pyproject.get("tool", {}).get("poetry", {}).get("version", "")
              elif source == "file":
                  version_path = root / os.environ["VERSION_PATH"].strip()
                  if not version_path.is_file():
                      raise SystemExit(f"Version file not found: {version_path}")
                  version = version_path.read_text().strip()
              else:
                  raise SystemExit("version_source must be 'toml' or 'file'")

          if not version:
              raise SystemExit("A version input or a value from the configured version source is required")

          changelog_section = ""
          changelog_path = os.environ["CHANGELOG_PATH"].strip()
          if changelog_path:
              changelog = root / changelog_path
              if changelog.is_file():
                  lines = changelog.read_text().splitlines()
                  heading = re.compile(
                      rf"^##\s+\[?{re.escape(version)}\]?(?:\s+.*)?\s*$"
                  )
                  notes = []
                  capturing = False
                  for line in lines:
                      if line.startswith("## "):
                          if capturing:
                              break
                          capturing = bool(heading.match(line.strip()))
                          continue
                      if capturing:
                          notes.append(line.rstrip())

                  note_lines = [line for line in notes if line.strip()]
                  if note_lines:
                      changelog_section = "Changelog\n" + "\n".join(note_lines)

          fallback_role = os.environ.get("DISCORD_ROLE_ID", "").strip()
          destinations = []
          for line_number, line in enumerate(os.environ["DISCORD_WEBHOOK_URL"].splitlines(), 1):
              parts = line.split()
              if not parts:
                  continue
              url, *roles = parts
              if not roles and fallback_role:
                  roles = [fallback_role]
              if any(not re.fullmatch(r"[0-9]+", role) for role in roles):
                  raise SystemExit(f"Invalid Discord role ID on destination line {line_number}")
              destinations.append((url, list(dict.fromkeys(roles))))
          if not destinations:
              raise SystemExit("At least one Discord webhook URL is required")

          succeeded = os.environ["RELEASE_SUCCESS"].lower() == "true"
          status = "was released successfully" if succeeded else "release failed"
          commit = f"Commit: `{os.environ['COMMIT_SHA'][:7]}` in `{os.environ['REPOSITORY']}`"

          def build_payload(roles):
              role_mention = " ".join(f"<@&{role}>" for role in roles)
              prefix = f"{role_mention + ' ' if role_mention else ''}{project_name} {version} {status}."
              sections = [prefix, os.environ["COMMIT_URL"]]
              if changelog_section and succeeded:
                  sections.extend([changelog_section, commit])
              else:
                  sections.append(commit)
              content = "\n\n".join(sections)

              if len(content) > 2000 and changelog_section and succeeded:
                  fixed = "\n\n".join([prefix, os.environ["COMMIT_URL"], "", commit])
                  available = max(0, 2000 - len(fixed) - len("Changelog\n") - len("..."))
                  notes = changelog_section[len("Changelog\n"):]
                  shortened = notes[:available].rstrip()
                  if len(shortened) < len(notes):
                      shortened = shortened.rstrip(".") + "..."
                  content = "\n\n".join([prefix, os.environ["COMMIT_URL"], "Changelog\n" + shortened, commit])

              return {"content": content, "allowed_mentions": {"parse": [], "roles": roles}}

          failed = False
          for index, (url, roles) in enumerate(destinations, 1):
              try:
                  request = Request(
                      url,
                      data=json.dumps(build_payload(roles)).encode(),
                      headers={"Content-Type": "application/json", "User-Agent": "GitHub-Actions-Discord-Notifier"},
                      method="POST",
                  )
                  with urlopen(request, timeout=30):
                      pass
                  print(f"Sent Discord notification to destination {index}")
              except Exception:
                  # Exception messages and response bodies can expose webhook credentials.
                  print(f"Failed to send Discord notification to destination {index}")
                  failed = True
          if failed:
              raise SystemExit("One or more Discord notifications failed")
          PY
